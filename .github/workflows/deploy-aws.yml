name: Deploy bwtr.ai to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bwtr-ai-aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate public site source
        run: |
          node scripts/test-canonical-urls.mjs
          node scripts/test-homepage-content.mjs
          git diff --check HEAD^ HEAD

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build public site artifact
        run: bash scripts/build-site-artifact.sh "${RUNNER_TEMP}/bwtr-site"

      - name: Snapshot current production site
        run: |
          mkdir -p "${RUNNER_TEMP}/bwtr-site-rollback"
          aws s3 sync "s3://${{ vars.AWS_S3_BUCKET }}" "${RUNNER_TEMP}/bwtr-site-rollback" \
            --exclude "assets/videos/*"

      - name: Publish, verify, and roll back on failure
        shell: bash
        run: |
          set -Eeuo pipefail

          bucket="${{ vars.AWS_S3_BUCKET }}"
          distribution="${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}"
          artifact="${RUNNER_TEMP}/bwtr-site"
          rollback_artifact="${RUNNER_TEMP}/bwtr-site-rollback"

          invalidate_and_wait() {
            local invalidation_id
            invalidation_id="$(aws cloudfront create-invalidation \
              --distribution-id "${distribution}" \
              --paths "/*" \
              --query 'Invalidation.Id' \
              --output text)"
            aws cloudfront wait invalidation-completed \
              --distribution-id "${distribution}" \
              --id "${invalidation_id}"
          }

          rollback() {
            local exit_code=$?
            trap - ERR
            set +e
            echo "Publish failed; restoring the pre-release site snapshot."
            aws s3 sync "${rollback_artifact}" "s3://${bucket}" \
              --delete \
              --exclude "assets/videos/*"
            local restore_status=$?
            invalidate_and_wait
            local invalidation_status=$?
            if [[ ${restore_status} -ne 0 || ${invalidation_status} -ne 0 ]]; then
              echo "Automatic rollback was incomplete; manual recovery is required." >&2
            fi
            exit "${exit_code}"
          }
          trap rollback ERR

          # Publish supporting files first and switch the homepage entry point last.
          aws s3 sync "${artifact}" "s3://${bucket}" \
            --exclude "assets/videos/*" \
            --exclude "index.html"
          aws s3 cp "${artifact}/index.html" "s3://${bucket}/index.html" \
            --content-type "text/html"

          # Remove stale public objects only after the complete release is present.
          aws s3 sync "${artifact}" "s3://${bucket}" \
            --delete \
            --exclude "assets/videos/*"

          invalidate_and_wait
          curl -fsS https://www.bwtr.ai/ | grep -F "One evidence chain, start to finish"
          curl -fsS https://www.bwtr.ai/ | grep -F "current and planned capabilities—not a claim that every step is available or connected today"
          curl -fsS https://www.bwtr.ai/products/ | grep -F "Every product is built around"
          for image in \
            infrastructure-substation.jpg \
            infrastructure-airport.jpg \
            infrastructure-utility-worker.jpg \
            infrastructure-hmi.jpg \
            product-demo-poster.jpg; do
            target="${RUNNER_TEMP}/${image}"
            curl -fsS --output "${target}" "https://www.bwtr.ai/assets/${image}"
            test "$(wc -c < "${target}")" -gt 10000
            curl -fsSI "https://www.bwtr.ai/assets/${image}" | grep -qi '^content-type: image/jpeg'
          done

          trap - ERR
