name: Deploy bwtr.ai to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bwtr-ai-aws-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BWTR_EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      BWTR_BUCKET: ${{ vars.AWS_S3_BUCKET }}
      BWTR_DISTRIBUTION: ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
      BWTR_CLOUDFRONT_DOMAIN: ${{ vars.AWS_CLOUDFRONT_DOMAIN }}
      BWTR_EXPECTED_GITHUB_SUBJECT: ${{ vars.AWS_OIDC_SUBJECT }}
      BWTR_SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate deployment configuration
        shell: bash
        run: |
          for required_variable in \
            AWS_REGION \
            BWTR_EXPECTED_AWS_ACCOUNT_ID \
            BWTR_BUCKET \
            BWTR_DISTRIBUTION \
            BWTR_CLOUDFRONT_DOMAIN \
            BWTR_EXPECTED_GITHUB_SUBJECT \
            BWTR_SITE_BASE_URL; do
            test -n "${!required_variable}" || {
              echo "Missing required deployment variable: ${required_variable}" >&2
              exit 2
            }
          done
          test "${BWTR_SITE_BASE_URL}" = "https://${BWTR_CLOUDFRONT_DOMAIN}"
          case "${BWTR_CLOUDFRONT_DOMAIN}" in
            *.cloudfront.net) ;;
            *) echo "AWS_CLOUDFRONT_DOMAIN must be a CloudFront domain" >&2; exit 2 ;;
          esac

      - name: Validate public site source
        run: |
          node scripts/test-brand-contract.mjs
          node scripts/test-canonical-urls.mjs
          node scripts/test-homepage-content.mjs
          node scripts/test-positioning.mjs
          bash scripts/test-publish-site.sh
          git diff --check HEAD^ HEAD

      - name: Validate rendered layouts
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 >"${RUNNER_TEMP}/bwtr-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "${preview_pid}" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4177/ >/dev/null; then
              break
            fi
            if [ "${attempt}" -eq 20 ]; then
              cat "${RUNNER_TEMP}/bwtr-preview.log"
              exit 1
            fi
            sleep 1
          done
          node scripts/test-rendered-layout.mjs

      - name: Verify canonical route infrastructure
        run: |
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "${BWTR_SITE_BASE_URL}/architecture")" = "301 ${BWTR_SITE_BASE_URL}/architecture/"
          test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "${BWTR_SITE_BASE_URL}/platform/")" = "301 ${BWTR_SITE_BASE_URL}/architecture/"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${BWTR_SITE_BASE_URL}/architecture/")" = "200"
          curl -fsS "${BWTR_SITE_BASE_URL}/architecture/" | grep -F "CUSTOMER-CONTROLLED DECISION BOUNDARY"

      - name: Verify GitHub OIDC claims
        shell: bash
        run: |
          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          OIDC_RESPONSE="${oidc_response}" node <<'NODE'
          const response = JSON.parse(process.env.OIDC_RESPONSE);
          const payload = JSON.parse(Buffer.from(response.value.split('.')[1], 'base64url'));
          console.log(`GitHub OIDC audience: ${payload.aud}`);
          console.log(`GitHub OIDC subject: ${payload.sub}`);
          if (payload.aud !== 'sts.amazonaws.com') process.exit(2);
          if (payload.sub !== process.env.BWTR_EXPECTED_GITHUB_SUBJECT) process.exit(2);
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS deployment target
        shell: bash
        run: |
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          test "${actual_account_id}" = "${BWTR_EXPECTED_AWS_ACCOUNT_ID}"

          aws s3api get-bucket-location --bucket "${BWTR_BUCKET}" >/dev/null

          actual_domain="$(aws cloudfront get-distribution \
            --id "${BWTR_DISTRIBUTION}" \
            --query 'Distribution.DomainName' \
            --output text)"
          test "${actual_domain}" = "${BWTR_CLOUDFRONT_DOMAIN}"

          expected_origin="${BWTR_BUCKET}.s3.${AWS_REGION}.amazonaws.com"
          actual_origin="$(aws cloudfront get-distribution \
            --id "${BWTR_DISTRIBUTION}" \
            --query "Distribution.DistributionConfig.Origins.Items[?DomainName=='${expected_origin}'].DomainName | [0]" \
            --output text)"
          test "${actual_origin}" = "${expected_origin}"

      - name: Build public site artifact
        run: bash scripts/build-site-artifact.sh "${RUNNER_TEMP}/bwtr-site"

      - name: Validate public site artifact
        run: |
          node scripts/test-site-artifact.mjs "${RUNNER_TEMP}/bwtr-site"
          node scripts/test-brand-contract.mjs --artifact "${RUNNER_TEMP}/bwtr-site"

      - name: Snapshot current production site
        run: |
          mkdir -p "${RUNNER_TEMP}/bwtr-site-rollback"
          aws s3 sync "s3://${BWTR_BUCKET}" "${RUNNER_TEMP}/bwtr-site-rollback" \
            --exclude "assets/videos/*"

      - name: Publish, verify, and roll back on failure
        shell: bash
        env:
          BWTR_ARTIFACT: ${{ runner.temp }}/bwtr-site
          BWTR_ROLLBACK_ARTIFACT: ${{ runner.temp }}/bwtr-site-rollback
        run: bash scripts/publish-site.sh
