AWSTemplateFormatVersion: '2010-09-09'
Description: Static website hosting for bwtr.ai using private S3, CloudFront OAC, and Route 53 aliases.

Parameters:
  DomainName:
    Type: String
    Default: bwtr.ai
  AlternateDomainName:
    Type: String
    Default: www.bwtr.ai
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 hosted zone ID for bwtr.ai. Required only when CreateRoute53Records is true.
  CreateRoute53Records:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
  AttachCustomDomains:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Attach bwtr.ai aliases. Set false for a non-live CloudFront preview or cross-account move preparation.
  UseCustomCertificate:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Attach the ACM certificate independently of aliases. Required before a cross-account alias move.
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN in us-east-1 covering bwtr.ai and www.bwtr.ai. Required when UseCustomCertificate is true.
  BucketName:
    Type: String
    Default: bwtr-ai-site-prod
    Description: Globally unique private S3 bucket name for the marketing site.

Rules:
  CustomDomainsRequireCertificate:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref AttachCustomDomains, "false"]
          - !Equals [!Ref UseCustomCertificate, "true"]
        AssertDescription: AttachCustomDomains=true requires UseCustomCertificate=true.
  CustomCertificateRequiresArn:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref UseCustomCertificate, "false"]
          - !Not [!Equals [!Ref CertificateArn, ""]]
        AssertDescription: UseCustomCertificate=true requires CertificateArn.
  Route53RecordsRequireCustomDomains:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref CreateRoute53Records, "false"]
          - !Equals [!Ref AttachCustomDomains, "true"]
        AssertDescription: CreateRoute53Records=true requires AttachCustomDomains=true.
  Route53RecordsRequireHostedZone:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref CreateRoute53Records, "false"]
          - !Not [!Equals [!Ref HostedZoneId, ""]]
        AssertDescription: CreateRoute53Records=true requires HostedZoneId.

Conditions:
  ShouldAttachCustomDomains: !Equals [!Ref AttachCustomDomains, "true"]
  ShouldUseCustomCertificate: !Equals [!Ref UseCustomCertificate, "true"]
  ShouldCreateRoute53Records: !And
    - !Condition ShouldAttachCustomDomains
    - !Equals [!Ref CreateRoute53Records, "true"]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        Description: CloudFront access control for the bwtr.ai static site bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        Comment: Security headers for the bwtr.ai static site.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            Protection: true
            ModeBlock: true
            Override: true

  CanonicalUrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      Name: !Sub '${AWS::StackName}-canonical-urls'
      FunctionConfig:
        Comment: Canonical www host, clean directory URLs, and S3 index rewrites
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        var attachCustomDomains = '${AttachCustomDomains}' === 'true';

        function encodeQueryPart(value) {
          return encodeURIComponent(value).replace(/[!'()*]/g, function(character) {
            return '%' + character.charCodeAt(0).toString(16).toUpperCase();
          });
        }

        function querySuffix(request) {
          var query = request.querystring || {};
          var parts = [];
          for (var key in query) {
            if (!Object.prototype.hasOwnProperty.call(query, key)) continue;
            var item = query[key];
            var values = item.multiValue || [item];
            for (var valueIndex = 0; valueIndex < values.length; valueIndex += 1) {
              parts.push(encodeQueryPart(key) + '=' + encodeQueryPart(values[valueIndex].value || ''));
            }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }

        function redirect(uri, request) {
          var requestHost = request.headers.host ? request.headers.host.value.toLowerCase() : '';
          var redirectHost = attachCustomDomains ? '${AlternateDomainName}' : requestHost;
          return {
            statusCode: 301,
            statusDescription: 'Moved Permanently',
            headers: {
              location: { value: 'https://' + redirectHost + uri + querySuffix(request) },
              'cache-control': { value: 'public, max-age=300' }
            }
          };
        }

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var host = request.headers.host ? request.headers.host.value.toLowerCase() : '';
          var canonicalHost = '${AlternateDomainName}';
          var pages = ['/products', '/architecture', '/research', '/about', '/security', '/airports', '/power-utilities', '/connected-industry', '/healthcare'];
          var canonicalUri = uri.replace(/\/{2,}/g, '/');

          if (canonicalUri === '/index.html') {
            canonicalUri = '/';
          }

          if (canonicalUri === '/platform' || canonicalUri === '/platform/' || canonicalUri === '/platform.html' || canonicalUri === '/platform/index.html') {
            canonicalUri = '/architecture/';
          }

          for (var index = 0; index < pages.length; index += 1) {
            var page = pages[index];
            if (canonicalUri === page || canonicalUri === page + '.html' || canonicalUri === page + '/index.html') {
              canonicalUri = page + '/';
              break;
            }
          }

          if ((attachCustomDomains && host !== canonicalHost) || canonicalUri !== uri) {
            return redirect(canonicalUri, request);
          }

          for (var pageIndex = 0; pageIndex < pages.length; pageIndex += 1) {
            if (uri === pages[pageIndex] + '/') {
              request.uri = pages[pageIndex] + '/index.html';
              break;
            }
          }

          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Breakwater bwtr.ai public marketing site
        Aliases: !If
          - ShouldAttachCustomDomains
          - - !Ref DomainName
            - !Ref AlternateDomainName
          - !Ref AWS::NoValue
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: SiteBucketOrigin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: SiteBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalUrlFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60
        ViewerCertificate: !If
          - ShouldUseCustomCertificate
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}'

  ApexAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  ApexAliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AlternateDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  WwwAliasRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AlternateDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt SiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  CloudFrontDistributionId:
    Value: !Ref SiteDistribution
  CloudFrontDomainName:
    Value: !GetAtt SiteDistribution.DomainName
  PreviewUrl:
    Value: !Sub 'https://${SiteDistribution.DomainName}'
  CanonicalUrlFunctionArn:
    Value: !GetAtt CanonicalUrlFunction.FunctionARN
